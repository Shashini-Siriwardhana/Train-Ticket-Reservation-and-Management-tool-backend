# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy ASP.Net Core app to Azure Web App - ticket-booking-api

on:
  push:
    branches:
      - dev
  workflow_dispatch:
  paths:
      - 'TrainTicketReservationSystem/**'
      - '.github/workflows/dev_ticket-booking-api.yml'

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      - name: Restore Booking API
        run: dotnet restore ./TrainTicketReservationSystem/TrainTicketReservationSystem.csproj

      - name: Build Booking API
        run: dotnet build ./TrainTicketReservationSystem/TrainTicketReservationSystem.csproj --configuration Release --no-restore

      - name: Publish Booking API
        run: dotnet publish ./TrainTicketReservationSystem/TrainTicketReservationSystem.csproj --configuration Release --no-build --output ./booking-publish

      - name: Show published files
        shell: pwsh
        run: Get-ChildItem ./booking-publish

      - name: Upload Booking API artifact
        uses: actions/upload-artifact@v4
        with:
          name: booking-api-app
          path: ./booking-publish

  deploy:
    runs-on: windows-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: booking-api-app
          path: ./booking-publish
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_980CFE70835E4B9587BA0E484D213512 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_79D5255007AC4D1C8F810538438B3FC9 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_0FC49362D1814027A0BC4D87D1C9AC94 }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'ticket-booking-api'
          slot-name: 'Production'
          package: ./booking-publish
          
